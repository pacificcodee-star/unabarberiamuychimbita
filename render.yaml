services:
  - type: web
    name: evolution-api
    runtime: image
    plan: free
    region: ohio
    image:
      url: docker.io/evoapicloud/evolution-api:v2.3.1
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: SERVER_URL
        sync: false
      - key: AUTHENTICATION_API_KEY
        sync: false
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        sync: false
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "true"
      - key: DATABASE_SAVE_MESSAGE_UPDATE
        value: "true"
      - key: DATABASE_SAVE_DATA_CONTACTS
        value: "true"
      - key: DATABASE_SAVE_DATA_CHATS
        value: "true"
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "true"
      - key: LANGUAGE
        value: es
      - key: LOG_LEVEL
        value: ERROR
      - key: LOG_COLOR
        value: "false"
      - key: DEL_INSTANCE
        value: "false"
      - key: QRCODE_LIMIT
        value: "30"
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: Una Barberia Muy Chimbita
      - key: CONFIG_SESSION_PHONE_NAME
        value: Chrome
      - key: TELEMETRY
        value: "false"
      - key: WEBHOOK_GLOBAL_ENABLED
        value: "false"
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
