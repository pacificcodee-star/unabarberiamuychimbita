services:
  - type: web
    name: barberia-muychimbita
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/Dockerfile.render
    dockerContext: .
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: America/Bogota
      - key: APP_LOCALE
        value: es
      - key: APP_FALLBACK_LOCALE
        value: es
      - key: APP_FAKER_LOCALE
        value: es_CO
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_ENCRYPT
        value: "false"
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log
      - key: WHATSAPP_DRIVER
        value: evolution
      - key: EVOLUTION_INSTANCE
        value: barberia
      - key: WHATSAPP_BOT_ENABLED
        value: "true"
      - key: WHATSAPP_DEFAULT_COUNTRY
        value: "57"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "true"
      - key: DATABASE_SAVE_MESSAGE_UPDATE
        value: "true"
      - key: DATABASE_SAVE_DATA_CONTACTS
        value: "true"
      - key: DATABASE_SAVE_DATA_CHATS
        value: "true"
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "true"
      - key: AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES
        value: "false"
      - key: LANGUAGE
        value: es
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: Una Barberia Muy Chimbita
      - key: CONFIG_SESSION_PHONE_NAME
        value: Chrome
      - key: QRCODE_LIMIT
        value: "30"
      - key: WEBHOOK_GLOBAL_ENABLED
        value: "false"
      - key: DEL_INSTANCE
        value: "false"
      - key: TELEMETRY_ENABLED
        value: "false"
      - key: LOG_COLOR
        value: "false"
      - key: NODE_OPTIONS
        value: --max-old-space-size=192
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: EVOLUTION_URL
        sync: false
      - key: EVOLUTION_APIKEY
        sync: false
      - key: EVOLUTION_WEBHOOK_SECRET
        sync: false
      - key: DB_URL
        sync: false
      - key: DATABASE_CONNECTION_URI
        sync: false
