[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:php-fpm]
command=php-fpm -F
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Caché de páginas públicas: borra cada 20 s las copias vencidas (PAGE_CACHE_TTL, 60 s por defecto).
; Caddy las entrega sin pasar por PHP, así que esta tarea es la que las hace vencer.
[program:page-cache-purge]
command=/bin/sh -c 'while true; do php /var/www/html/artisan barberia:page-cache purgar >/dev/null 2>&1; sleep 20; done'
user=www-data
autorestart=true
priority=30
stdout_logfile=/dev/null
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
