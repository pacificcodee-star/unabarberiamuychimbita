; Ajustes de PHP para producción (se copian a /usr/local/etc/php/conf.d/ en las imágenes Docker).
; Sin esto, PHP usa 2 MB por archivo y 8 MB por petición: los videos del panel (hasta 50 MB) fallarían.
upload_max_filesize = 110M
post_max_size = 120M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 60
max_input_time = 120
; No anunciar la versión de PHP en las cabeceras.
expose_php = Off
; Errores al registro, nunca en pantalla.
display_errors = Off
log_errors = On
; Sesiones solo por cookie, sin id en la URL.
session.use_strict_mode = 1
session.use_only_cookies = 1
