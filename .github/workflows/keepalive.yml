name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Tocar el servicio para que Render no lo duerma
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Define la variable de repositorio APP_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 0
          fi
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$APP_URL/up") || true
            echo "intento $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "sin respuesta 200 (el servicio puede estar arrancando)"
